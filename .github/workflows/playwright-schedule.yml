name: Scheduled Playwright Tests

on:
  schedule:
    # Triggers daily at 9:00 AM AEST (11:00 PM UTC)
    - cron: '0 23 * * *'
  workflow_dispatch: # Keeps manual execution terminal checks active

permissions:
  contents: write # Grants runner authorization writes to branch code databases

jobs:
  automation-runner:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - name: Checkout project repository tree
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Initialize runtime Node execution channels
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Sync manifest dependency modules
      run: npm ci

    - name: Fetch framework automated browser dependencies
      run: npx playwright install --with-deps

    - name: Execute automated test script
      run: npx playwright test tests/screenshot2.spec.ts
      env:
        SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

    - name: Compile and archive native tracing reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 14

    - name: Host images on isolated public repository media branches
      if: always()
      run: |
        git config --global user.name "GitHub Automation Bot"
        git config --global user.email "actions@github.com"
        git checkout -b media-storage || git checkout media-storage
        git add screenshots/
        git commit -m "storage: push snapshot run files [skip ci]" || echo "No asset modifications verified"
        git push origin media-storage --force